# Improved DAS settings (fixed after full-val underperformance of v1)
# Changes vs first freeze:
#   - scale_adaptive: false (ablation: fixed 512 was better)
#   - fusion: nms (harder floor; WBF was diluting scores)
#   - border_weight: 0.75 (less aggressive)
#   - tau: 0.12 (slightly more regions)
das:
  grid_rows: 32
  grid_cols: 32
  coarse_conf: 0.05
  final_conf: 0.25
  tau: 0.12
  k: 8.0
  slice_min: 256
  slice_max: 1024
  default_slice: 512
  overlap_ratio: 0.2
  n_max: 4
  use_coarse_prior: true
  use_image_prior: true
  scale_adaptive: false
  fusion: nms
  border_margin: 8
  border_weight: 0.75
  scale_gate: 96
  wbf_iou_thr: 0.5
  image_prior_weight: 0.35
  coarse_prior_weight: 0.65

models:
  in_domain: [yolov8n, yolov8s, yolov11n, yolov11s]
  cross_dataset: [dfine_n, dfine_s]

runtime:
  device: cpu
  num_threads: 4
  conf: 0.25
  latency_repeats: 3
  warmup_iters: 3
  imgsz: 640

sahi:
  slice_sizes: [512]
  overlaps: [0.2]
  with_full_image: [true]
