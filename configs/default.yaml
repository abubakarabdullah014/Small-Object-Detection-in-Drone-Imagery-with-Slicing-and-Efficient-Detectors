# Default DAS hyperparameters (improved v2 after full-val analysis)
das:
  grid_rows: 32
  grid_cols: 32
  coarse_conf: 0.05
  final_conf: 0.25
  tau: 0.12
  k: 8.0
  slice_min: 256
  slice_max: 1024
  default_slice: 512
  overlap_ratio: 0.2
  n_max: 4
  use_coarse_prior: true
  use_image_prior: true
  scale_adaptive: false
  fusion: nms
  border_margin: 8
  border_weight: 0.75
  scale_gate: 96
  wbf_iou_thr: 0.5
  image_prior_weight: 0.35
  coarse_prior_weight: 0.65

# SAHI grid search
sahi:
  slice_sizes: [384, 512, 640, 768]
  overlaps: [0.1, 0.2, 0.3]
  with_full_image: [true, false]

# Models to evaluate
models:
  in_domain: [yolov8n, yolov8s, yolov11n, yolov11s]
  cross_dataset: [dfine_n, dfine_s]

# Runtime
runtime:
  device: cpu
  num_threads: 4
  conf: 0.25
  latency_repeats: 3
  warmup_iters: 3
  imgsz: 640
